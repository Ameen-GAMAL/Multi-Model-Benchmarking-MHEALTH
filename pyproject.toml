[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhealth-benchmark"
version = "0.2.0"
description = "From-scratch classifier evaluation on subject-grouped wearable-sensor time series"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24,<2", "pandas>=2.0,<3", "threadpoolctl>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "scikit-learn>=1.3,<1.7", "ruff>=0.11,<0.12", "build>=1.2,<2"]
plots = ["matplotlib>=3.6,<4"]

[project.scripts]
mhealth-benchmark = "mhealth_benchmark.benchmark:main"
mhealth-download = "mhealth_benchmark.dataset:main"

[tool.setuptools]
packages = ["mhealth_benchmark", "mhealth_benchmark.models"]
package-dir = { mhealth_benchmark = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"tests/test_models.py" = ["E402"]
